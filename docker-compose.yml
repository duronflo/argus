services:
  argus:
    image: ghcr.io/duronflo/argus:latest
    container_name: argus
    ports:
      - "3000:3000"
    volumes:
      # Persist the SQLite database across container restarts and updates.
      # Only the data directory is mounted – server code stays inside the image
      # so that updates via Watchtower take effect immediately on restart.
      - argus-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/data.db
    restart: unless-stopped
    labels:
      # Watchtower uses this label to identify containers it should manage
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    # Watchtower wrapped with a small shell entrypoint that tees its output to
    # /var/log/watchtower/watchtower.log (built by GitHub Actions, see
    # docker/watchtower.Dockerfile).
    image: ghcr.io/duronflo/argus-watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - watchtower-logs:/var/log/watchtower
    environment:
      # Docker Engine >= 29 rejects the default API version (1.25) used by
      # containrrr/watchtower, which silently stops all auto-updates.
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_LOG_LEVEL=debug
      - WATCHTOWER_LOG_FORMAT=Pretty
    # Poll every 5 minutes for new image digests
    command: --interval 300 --label-enable
    restart: unless-stopped

volumes:
  argus-data:
  watchtower-logs:
