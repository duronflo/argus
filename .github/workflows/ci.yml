name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # same as the Docker image
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image (build & start)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: argus:ci
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and check app, API and SQLite
        run: |
          docker run -d --name argus -p 3000:3000 argus:ci
          for i in $(seq 1 30); do curl -fs http://localhost:3000/ >/dev/null && break; sleep 1; done
          docker exec argus node --version
          curl -fs http://localhost:3000/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/project)" = 404
          curl -fs -X PUT -H 'Content-Type: application/json' \
            -d '{"schemaVersion":2,"projekt":{"name":"CI"},"gewerke":[],"angebote":[]}' \
            http://localhost:3000/api/project
          curl -fs http://localhost:3000/api/project | grep -q '"name":"CI"'

      - name: Container logs
        if: always()
        run: docker logs argus || true
